name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'c2pa/v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: build-test (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   goarch: amd64, runner: ubuntu-latest,     rust_toolchain: stable }
          - { os: linux,   goarch: arm64, runner: ubuntu-24.04-arm,  rust_toolchain: stable }
          - { os: macos,   goarch: amd64, runner: macos-26-intel,    rust_toolchain: stable }
          - { os: macos,   goarch: arm64, runner: macos-latest,      rust_toolchain: stable }
          - { os: windows, goarch: amd64, runner: windows-latest,    rust_toolchain: stable-x86_64-pc-windows-gnu }
          - { os: windows, goarch: arm64, runner: windows-11-arm,    rust_toolchain: stable-aarch64-pc-windows-gnullvm }
    env:
      GO_VERSION: '1.25.x'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            c2pa/go.sum
            example/go.sum

      - name: Set up MSYS2 (windows mingw toolchain for cgo)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.goarch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          update: false
          install: >-
            ${{ matrix.goarch == 'arm64' && 'mingw-w64-clang-aarch64-toolchain' || 'mingw-w64-x86_64-toolchain' }}
          path-type: inherit

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          cache: true
          cache-workspaces: c2pa-rs

      - name: Set up Node.js (for quicktype schema generation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run go generate (release)
        if: matrix.os != 'windows' || matrix.goarch != 'arm64'
        # Regenerates ./c2pa/schema and builds c2pa-rs/c2pa_c_ffi for the
        # release flavor via the go:generate directives in c2pa/generate*.go.
        env:
          CGO_ENABLED: '1'
        run: go generate -tags=release ./c2pa/...

      - name: Run go generate (release, windows arm64)
        if: matrix.os == 'windows' && matrix.goarch == 'arm64'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: clang
          CXX: clang++
          AR: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR: llvm-ar
        run: go generate -tags=release ./c2pa/...

      - name: Go vet (release)
        if: matrix.os != 'windows' || matrix.goarch != 'arm64'
        env:
          CGO_ENABLED: '1'
        run: go vet -tags=release ./c2pa/...

      - name: Go vet (release, windows arm64)
        if: matrix.os == 'windows' && matrix.goarch == 'arm64'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: clang
          CXX: clang++
          AR: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR: llvm-ar
        run: go vet -tags=release ./c2pa/...

      - name: Go build (release)
        if: matrix.os != 'windows' || matrix.goarch != 'arm64'
        env:
          CGO_ENABLED: '1'
        run: |
          go build -tags=release ./c2pa
          go build -tags=release -o dist/demo ./example

      - name: Go build (release, windows arm64)
        if: matrix.os == 'windows' && matrix.goarch == 'arm64'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: clang
          CXX: clang++
          AR: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR: llvm-ar
        run: |
          go build -tags=release ./c2pa
          go build -tags=release -o dist/demo ./example

      - name: Go test (release)
        if: matrix.os != 'windows' || matrix.goarch != 'arm64'
        env:
          CGO_ENABLED: '1'
        run: go test -tags=release -v ./c2pa/...

      - name: Go test (release, windows arm64)
        if: matrix.os == 'windows' && matrix.goarch == 'arm64'
        shell: msys2 {0}
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: arm64
          CC: clang
          CXX: clang++
          AR: llvm-ar
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER: clang
          CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_AR: llvm-ar
        run: go test -tags=release -v ./c2pa/...

      - name: Stage release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          cp c2pa-rs/target/release/libc2pa_c.*  dist/ 2>/dev/null || true
          cp c2pa-rs/target/release/c2pa_c.lib   dist/ 2>/dev/null || true
          cp c2pa-rs/target/release/c2pa_c.dll   dist/ 2>/dev/null || true
          cp c2pa-rs/target/release/c2pa.h      dist/ 2>/dev/null || true
          ls -la dist

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: c2pa-c-libs-release-${{ matrix.os }}-${{ matrix.goarch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Tag & publish Go module
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Validate tag format
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          echo "Releasing tag: $tag"
          case "$tag" in
            c2pa/v*|v*) echo "Tag format OK";;
            *) echo "Unexpected tag format: $tag"; exit 1;;
          esac

      - name: Prime proxy.golang.org
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          ver="${tag#c2pa/}"
          # Best-effort: ask the Go module proxy to fetch the new tag so the
          # module version becomes resolvable via `go get`.
          curl -fsSL "https://proxy.golang.org/github.com/duggaraju/c2pa-go/c2pa/@v/${ver}.info" || true
          go list -m -versions github.com/duggaraju/c2pa-go/c2pa || true

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: c2pa-c-libs-release-*-${{ github.sha }}
          path: dist
          merge-multiple: false

      - name: Repackage release binaries per platform
        run: |
          set -euo pipefail
          cd dist
          for d in c2pa-c-libs-release-*-${{ github.sha }}; do
            [ -d "$d" ] || continue
            name="${d%-${{ github.sha }}}"
            (cd "$d" && tar czf "../${name}.tar.gz" .)
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
