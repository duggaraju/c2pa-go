name: Update c2pa-rs submodule

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Specific c2pa-c-ffi tag to update to (e.g., c2pa-c-ffi-v0.62.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    if: github.event_name != 'pull_request'
    name: Check for new c2pa-c-ffi tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current submodule commit
        id: current
        run: |
          set -euo pipefail
          cd c2pa-rs
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "commit=$CURRENT_COMMIT" >> "$GITHUB_OUTPUT"

          # Try to find a c2pa-c-ffi tag pointing at the current commit.
          CURRENT_TAG=$(git tag --points-at HEAD | grep '^c2pa-c-ffi-v' | sort -V | tail -1 || echo "")
          echo "tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "Current submodule commit: $CURRENT_COMMIT"
          echo "Current tag (if any): $CURRENT_TAG"

      - name: Find latest c2pa-c-ffi tag
        id: latest
        run: |
          set -euo pipefail
          cd c2pa-rs
          git fetch --tags --force origin

          LATEST_TAG=$(git tag -l 'c2pa-c-ffi-v*' \
            | grep -E '^c2pa-c-ffi-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No c2pa-c-ffi tags found"
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Latest c2pa-c-ffi tag: $LATEST_TAG"

          LATEST_COMMIT=$(git rev-list -n 1 "$LATEST_TAG")
          echo "commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Latest tag commit: $LATEST_COMMIT"

      - name: Resolve target tag
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TARGET_TAG="${{ github.event.inputs.tag }}"
            echo "Using manually specified tag: $TARGET_TAG"
          else
            TARGET_TAG="${{ steps.latest.outputs.tag }}"
            echo "Using latest discovered tag: $TARGET_TAG"
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

          cd c2pa-rs
          if ! git rev-parse "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TARGET_TAG does not exist"
            exit 1
          fi

          TARGET_COMMIT=$(git rev-list -n 1 "$TARGET_TAG")
          echo "commit=$TARGET_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        run: |
          set -euo pipefail
          CURRENT="${{ steps.current.outputs.commit }}"
          TARGET="${{ steps.target.outputs.commit }}"

          if [ "$CURRENT" = "$TARGET" ]; then
            echo "Submodule is already at the target tag ${{ steps.target.outputs.tag }}"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update needed from ${{ steps.current.outputs.tag || steps.current.outputs.commit }} to ${{ steps.target.outputs.tag }}"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            c2pa/go.sum
            c2pa-cli/go.sum

      - name: Set up Rust
        if: steps.check.outputs.needed == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true
          cache-workspaces: c2pa-rs

      - name: Set up Node.js (for quicktype schema generation)
        if: steps.check.outputs.needed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Update submodule
        id: update
        if: steps.check.outputs.needed == 'true'
        run: |
          set -euo pipefail
          TARGET_TAG="${{ steps.target.outputs.tag }}"
          BRANCH_NAME="bot/update-c2pa-rs-${TARGET_TAG}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ -z "$DEFAULT_BRANCH" ]; then
            DEFAULT_BRANCH="main"
          fi

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          # Reset the bot branch from the default branch to avoid non-fast-forward push issues.
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$BRANCH_NAME" "origin/$DEFAULT_BRANCH"

          # Move the submodule to the target tag.
          cd c2pa-rs
          git fetch --tags --force origin
          git checkout "$TARGET_TAG"
          cd ..

          # Extract version number from tag (e.g., c2pa-c-ffi-v0.76.0 -> 0.76.0).
          VERSION=$(echo "$TARGET_TAG" | sed 's/^c2pa-c-ffi-v//')
          MAJOR_MINOR=$(echo "$VERSION" | awk -F. '{print $1"."$2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Update the c2pa-rs shields.io badge in README.md.
          sed -i -E "s|c2pa--rs-v[0-9]+\.[0-9]+\.[0-9]+-orange|c2pa--rs-v${VERSION}-orange|g" README.md
          # Update prose like: "track c2pa-rs `0.84.x`".
          sed -i -E "s|track c2pa-rs \`[0-9]+\.[0-9]+\.x\`|track c2pa-rs \`${MAJOR_MINOR}.x\`|g" README.md

          # Keep the CLI dependency and workspace replacement aligned with the target release.
          sed -i -E "s|(require github.com/duggaraju/c2pa-go/c2pa )v[0-9]+\.[0-9]+\.[0-9]+|\1v${VERSION}|" c2pa-cli/go.mod
          sed -i -E "s|(replace github.com/duggaraju/c2pa-go/c2pa )v[0-9]+\.[0-9]+\.[0-9]+( => ./c2pa)|\1v${VERSION}\2|" go.work

          grep -Fx "require github.com/duggaraju/c2pa-go/c2pa v${VERSION}" c2pa-cli/go.mod
          grep -Fx "replace github.com/duggaraju/c2pa-go/c2pa v${VERSION} => ./c2pa" go.work

          # Regenerate the checked-in schema types from the new c2pa-rs revision.
          go generate ./c2pa/schema/...

          git add c2pa-rs README.md go.work c2pa-cli/go.mod c2pa/schema/schema.go

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(c2pa-rs): bump submodule to ${TARGET_TAG}"
          git push --force-with-lease origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.check.outputs.needed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetTag = '${{ steps.target.outputs.tag }}';
            const branchName = '${{ steps.update.outputs.branch }}';
            const currentTagFromOutput = '${{ steps.current.outputs.tag }}';
            const currentTag = currentTagFromOutput || 'unknown';

            const title = `chore(c2pa-rs): bump submodule to ${targetTag}`;
            const body = `## Submodule Update

            This PR updates the \`c2pa-rs\` submodule to the latest C FFI release.

            **Target Tag:** \`${targetTag}\`
            **Previous Tag:** \`${currentTag}\`
            **Previous Commit:** \`${{ steps.current.outputs.commit }}\`
            **New Commit:** \`${{ steps.target.outputs.commit }}\`

            ### Changes

            This automated update tracks the upstream c2pa-rs C FFI releases to keep the Go bindings up-to-date. The README badge and version references have been updated to match, and the checked-in \`c2pa/schema/schema.go\` has been regenerated from the new c2pa-rs revision.

            ### Checklist

            - [ ] Review the [c2pa-rs release notes](https://github.com/contentauth/c2pa-rs/releases/tag/${targetTag})
            - [ ] Build and test the changes
            - [ ] Verify native bindings compatibility
            - [ ] Update any related documentation if needed

            ---
            *This PR was automatically created by the [Update c2pa-rs submodule workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).*`;

            try {
              const { data: existingPRs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branchName}`,
                state: 'open'
              });

              if (existingPRs.length > 0) {
                console.log(`PR already exists: #${existingPRs[0].number}`);
                return;
              }

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: branchName,
                base: context.payload.repository.default_branch || 'main',
                body: body
              });

              console.log(`Created PR #${pr.number}: ${pr.html_url}`);

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['dependencies', 'submodule-update', 'automated']
              });
            } catch (error) {
              console.error('Error creating PR:', error);
              throw error;
            }

  tag-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'bot/update-c2pa-rs-c2pa-c-ffi-v') &&
      contains(github.event.pull_request.labels.*.name, 'submodule-update')
    name: Tag merged submodule update
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release tags
        id: release
        run: |
          set -euo pipefail
          git -C c2pa-rs fetch --tags --force origin
          UPSTREAM_TAG=$(git -C c2pa-rs tag --points-at HEAD --list 'c2pa-c-ffi-v*' | sort -V | tail -1)

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "The merged submodule commit does not have a c2pa-c-ffi release tag"
            exit 1
          fi

          VERSION=${UPSTREAM_TAG#c2pa-c-ffi-v}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Cannot derive a valid release version from $UPSTREAM_TAG"
            exit 1
          fi

          C2PA_TAG="c2pa/v$VERSION"
          CLI_TAG="c2pa-cli/v$VERSION"
          echo "tag=$C2PA_TAG" >> "$GITHUB_OUTPUT"
          git fetch --tags origin

          CREATED=false
          for RELEASE_TAG in "$C2PA_TAG" "$CLI_TAG"; do
            if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
              if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
                echo "Release tag $RELEASE_TAG already points to $TAG_COMMIT"
                exit 1
              fi

              echo "Release tag $RELEASE_TAG already exists on this commit"
              continue
            fi

            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
            CREATED=true
          done
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      # Events created with GITHUB_TOKEN do not start another workflow, so
      # explicitly run CI using the primary module's newly created tag ref.
      - name: Start release workflow
        if: steps.release.outputs.created == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: process.env.RELEASE_TAG
            });
            console.log(`Started CI for ${process.env.RELEASE_TAG}`);
